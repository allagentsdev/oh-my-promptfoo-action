name: oh-my-promptfoo Evals
description: Run one authored Promptfoo config with pinned tooling and private local artifacts
branding:
  icon: check-circle
  color: purple
inputs:
  toolchain-mode:
    description: source builds the reviewed frozen toolchain; installed uses the exact reviewed packages in dependency-directory
    default: "source"
  dependency-directory:
    description: Caller-installed node_modules directory relative to working-directory; required only with toolchain-mode installed
    default: ""
  execution-mode:
    description: live evaluates the authored config; replay renders a recorded scored result without candidate or grader calls
    default: "live"
  replay-results:
    description: Native scored-result JSON relative to working-directory; required only in replay mode
    default: ""
  config:
    description: One local Promptfoo config file, relative to working-directory
    required: true
  args-json:
    description: Public JSON array of native argument strings; GitHub may print literal inputs before execution
    default: "[]"
  args-file:
    description: Private JSON argument-array file relative to working-directory; use for sensitive values instead of args-json
    default: ""
  working-directory:
    description: Directory in the caller checkout from which to run Promptfoo
    default: "."
  output-directory:
    description: Local artifact parent directory, relative to working-directory; each invocation creates a fresh child
    default: ".promptfoo-ci"
  suite-number:
    description: Legacy JSON suite reference; not displayed in reports or required for separate job cards
    default: "1"
  public-labels:
    description: Publish authored suite/test IDs and descriptions, provider labels and assertion metric names; keep false for private labels
    default: "false"
  upload-results:
    description: Explicitly approve uploading a credential-redacted scored result to this repository's GitHub artifact storage
    default: "false"
  artifact-retention-days:
    description: Artifact retention override; 0 uses the calling repository's default, within GitHub policy limits
    default: "0"
  artifact-name:
    description: Optional unique artifact name; defaults to a generated name for this invocation
    default: ""
outputs:
  replayed:
    description: true when the report uses recorded results and no candidate or grader calls were made
    value: ${{ steps.evaluate.outputs.replayed }}
  result-artifact-url:
    description: Download URL after an explicitly enabled upload succeeds; empty otherwise
    value: ${{ steps.upload.outputs.artifact-url }}
  result-artifact-id:
    description: Uploaded GitHub artifact ID; empty when no upload succeeded
    value: ${{ steps.upload.outputs.artifact-id }}
  result-path:
    description: Absolute native JSON path; check results-available before reading
    value: ${{ steps.evaluate.outputs.result-path }}
  results-available:
    description: Whether the native JSON was produced and parsed (coverage can still be invalid)
    value: ${{ steps.evaluate.outputs.results-available }}
  artifact-directory:
    description: Absolute run directory with private raw results, logs and sanitized reports; retained on failure
    value: ${{ steps.evaluate.outputs.artifact-directory }}
  log-path:
    description: Absolute private native stdout/stderr log path
    value: ${{ steps.evaluate.outputs.log-path }}
  report-path:
    description: Absolute sanitized report JSON path
    value: ${{ steps.evaluate.outputs.report-path }}
  summary-path:
    description: Absolute sanitized Markdown summary path
    value: ${{ steps.evaluate.outputs.summary-path }}
  evaluation-status:
    description: pass, fail or error; incomplete results and zero coverage are errors
    value: ${{ steps.evaluate.outputs.evaluation-status }}
  evaluation-exit-code:
    description: Native CLI exit code, or unknown when it could not finish
    value: ${{ steps.evaluate.outputs.evaluation-exit-code }}
runs:
  using: composite
  steps:
    - name: Resolve Action toolchain paths
      id: toolchain
      shell: bash
      env:
        OMP_ACTION_PATH: ${{ github.action_path }}
        OMP_TOOLCHAIN_MODE: ${{ inputs.toolchain-mode }}
        OMP_DEPENDENCY_DIRECTORY: ${{ inputs.dependency-directory }}
      run: node "$OMP_ACTION_PATH/scripts/prepare-toolchain.mjs" --setup
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: ${{ steps.toolchain.outputs.node-version-file }}
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      if: ${{ inputs.toolchain-mode != 'installed' }}
      with:
        package_json_file: ${{ steps.toolchain.outputs.manifest }}
        run_install: false
    - name: Prepare reviewed evaluation toolchain
      id: runtime
      shell: bash
      env:
        OMP_ACTION_PATH: ${{ github.action_path }}
        OMP_TOOLCHAIN_MODE: ${{ inputs.toolchain-mode }}
        OMP_DEPENDENCY_DIRECTORY: ${{ inputs.dependency-directory }}
        OMP_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        node "$OMP_ACTION_PATH/scripts/prepare-toolchain.mjs"
    - name: Evaluate and report
      id: evaluate
      shell: bash
      env:
        OMP_ACTION_PATH: ${{ github.action_path }}
        OMP_EXECUTION_MODE: ${{ inputs.execution-mode }}
        OMP_REPLAY_RESULTS: ${{ inputs.replay-results }}
        OMP_CLI_PATH: ${{ steps.runtime.outputs.cli-path }}
        OMP_CONFIG: ${{ inputs.config }}
        OMP_ARGS: ${{ inputs.args-json }}
        OMP_ARGS_FILE: ${{ inputs.args-file }}
        OMP_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        OMP_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        OMP_SUITE_NUMBER: ${{ inputs.suite-number }}
        OMP_PUBLIC_LABELS: ${{ inputs.public-labels }}
      run: |
        node "$OMP_ACTION_PATH/scripts/evaluate.mjs"
    - name: Prepare the approved scored result
      id: scored
      if: ${{ !cancelled() && inputs.upload-results == 'true' && steps.evaluate.outputs.results-available == 'true' }}
      shell: bash
      env:
        OMP_REPORTING_PATH: ${{ steps.runtime.outputs.reporting-path }}
        OMP_RESULT_PATH: ${{ steps.evaluate.outputs.result-path }}
        OMP_RESULT_DIRECTORY: ${{ steps.evaluate.outputs.artifact-directory }}
        OMP_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      run: |
        node --input-type=module <<'NODE'
        import { appendFile } from 'node:fs/promises';
        import { join } from 'node:path';
        import { pathToFileURL } from 'node:url';
        const retention = Number(process.env.OMP_ARTIFACT_RETENTION_DAYS);
        if (!Number.isSafeInteger(retention) || retention < 0) throw new Error('Artifact retention must be a non-negative whole number of days');
        const { prepareResultArtifact } = await import(pathToFileURL(process.env.OMP_REPORTING_PATH));
        const path = join(process.env.OMP_RESULT_DIRECTORY, 'scored-results.json');
        await prepareResultArtifact(process.env.OMP_RESULT_PATH, path);
        const delimiter = crypto.randomUUID();
        await appendFile(process.env.GITHUB_OUTPUT, `path<<${delimiter}\n${path}\n${delimiter}\n`);
        NODE
    - name: Upload the approved scored result
      id: upload
      if: ${{ !cancelled() && inputs.upload-results == 'true' && steps.scored.outputs.path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name || steps.toolchain.outputs.artifact-name }}
        path: ${{ steps.scored.outputs.path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
    - name: Link the scored result in the suite card
      if: ${{ !cancelled() && steps.upload.outputs.artifact-url != '' }}
      shell: bash
      env:
        OMP_REPORTING_PATH: ${{ steps.runtime.outputs.reporting-path }}
        OMP_SUMMARY_PATH: ${{ steps.evaluate.outputs.summary-path }}
        OMP_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        OMP_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
      run: |
        node --input-type=module <<'NODE'
        import { appendFile } from 'node:fs/promises';
        import { pathToFileURL } from 'node:url';
        const { renderResultArtifactLink } = await import(pathToFileURL(process.env.OMP_REPORTING_PATH));
        const requested = Number(process.env.OMP_ARTIFACT_RETENTION_DAYS);
        const maximum = Number(process.env.GITHUB_RETENTION_DAYS);
        const days = maximum > 0 ? Math.min(requested || maximum, maximum) : requested || undefined;
        const note = renderResultArtifactLink(process.env.OMP_ARTIFACT_URL, days);
        for (const path of new Set([process.env.OMP_SUMMARY_PATH, process.env.GITHUB_STEP_SUMMARY].filter(Boolean))) await appendFile(path, note);
        NODE
